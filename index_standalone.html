    function StandaloneApp() {
      const [isMuted, setIsMuted] = useState(true);
      const [isPlaying, setIsPlaying] = useState(true);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [isSeeking, setIsSeeking] = useState(false);
      const [playbackSpeed, setPlaybackSpeed] = useState(1);
      const [showSpeedMenu, setShowSpeedMenu] = useState(false);
      const [activeTab, setActiveTab] = useState(0);
      const [isDownloadOpen, setIsDownloadOpen] = useState(false);
      const [pricingEmployees, setPricingEmployees] = useState(50);
      const videoRef = useRef(null);

      const calcEstimate = (count) => {
        if (count <= 45) return count * 65;
        if (count <= 50) return 3000;
        if (count <= 90) return 3000 + (count - 50) * 50;
        if (count <= 100) return 5000;
        return 5000 + (count - 100) * 45;
      };

      const toggleSound = (e) => {
        if (e) e.stopPropagation();
        if (videoRef.current) {
          videoRef.current.muted = !isMuted;
          setIsMuted(!isMuted);
        }
      };

      const togglePlayPause = (e) => {
        if (e) e.stopPropagation();
        if (videoRef.current) {
          if (videoRef.current.paused) {
            videoRef.current.play();
            setIsPlaying(true);
          } else {
            videoRef.current.pause();
            setIsPlaying(false);
          }
        }
      };

      const handleTimeUpdate = () => {
        if (!isSeeking && videoRef.current) {
          setCurrentTime(videoRef.current.currentTime);
        }
      };

      const handleLoadedMetadata = () => {
        if (videoRef.current) {
          setDuration(videoRef.current.duration || 0);
        }
      };

      const handleSeekChange = (e) => {
        const newTime = parseFloat(e.target.value);
        setCurrentTime(newTime);
        if (videoRef.current) {
          videoRef.current.currentTime = newTime;
        }
      };

      const changeSpeed = (speed) => {
        if (videoRef.current) {
          videoRef.current.playbackRate = speed;
          setPlaybackSpeed(speed);
          setShowSpeedMenu(false);
        }
      };

      const formatTime = (timeInSeconds) => {
        if (isNaN(timeInSeconds) || timeInSeconds < 0) return '0:00';
        const minutes = Math.floor(timeInSeconds / 60);
        const seconds = Math.floor(timeInSeconds % 60);
        return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      };

      const progressPercent = duration > 0 ? (currentTime / duration) * 100 : 0;
      const triggerApk = () => {
        const link = document.createElement('a');
        link.href = './logmitra-2.2.1.apk';
        link.download = 'logmitra-2.2.1.apk';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };
